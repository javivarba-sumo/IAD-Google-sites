<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--tp:#1a1a18;--ts:#6b6b66;
  --border:rgba(0,0,0,0.12);--curdot:#378ADD;--curtext:#185FA5;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --today-line:#5A9E6F;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--tp:#f0ede8;--ts:#9b9b96;
  --border:rgba(255,255,255,0.12);
}}
body{font-family:var(--font);background:var(--bg);color:var(--tp);padding:24px 20px 48px;min-height:100vh}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ts);text-transform:uppercase;margin-bottom:6px}
h1{font-size:22px;font-weight:500;margin-bottom:6px}
.sub{font-size:13px;color:var(--ts);margin-bottom:24px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:.5px solid var(--border);margin-bottom:20px}
.tab{padding:7px 13px;font-size:13px;cursor:pointer;border:none;background:none;color:var(--ts);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;font-family:var(--font)}
.tab:hover{color:var(--tp)}
.tab.active{color:var(--tp);font-weight:500;border-bottom-color:var(--tp)}
.tdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sumrow{font-size:11px;color:var(--ts);margin-bottom:10px}
/* gantt wrapper — relative so the today line can be absolute inside */
#gantt-wrap{position:relative}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:11px;font-weight:500;color:var(--ts);padding:5px 8px 8px;text-align:left;border-bottom:.5px solid var(--border)}
.cws{width:180px}
.cq{width:calc((100% - 180px)/4)}
.qcur{color:var(--curtext)!important}
.cdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--curdot);margin-right:4px;vertical-align:middle}
td{vertical-align:top;padding:0}
.wscell{padding:8px 8px 2px 0;vertical-align:middle}
.wslabel{font-size:12px;font-weight:500;color:var(--tp)}
.rdiv td{border-top:.5px solid var(--border)}
.sbar{position:absolute;top:0;height:22px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11px;justify-content:center;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Today marker */
#today-marker{
  position:absolute;
  top:0;bottom:0;
  width:0;
  border-left:2px dashed var(--today-line);
  pointer-events:none;
  z-index:10;
}
</style>

const TABS=['All IAD','IT','Solutions Engineering','Data Engineering','Data Analytics','Program Management'];
let active='All IAD';
function col(t){return(t&&C[t])||fb}

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>{
    const c=col(t==='All IAD'?null:t);
    return`<button class="tab${t===active?' active':''}" onclick="sw('${t.replace(/'/g,"\\'")}')">
      <span class="tdot" style="background:${t==='All IAD'?'#888':c.dot}"></span>${t}</button>`;
  }).join('');
}

function render(){
  const ws=D[active];
  const tot=ws.reduce((s,w)=>s+w.items.length,0);
  document.getElementById('sumrow').textContent=`${ws.length} workstreams · ${tot} initiatives`;
  let rows='';
  ws.forEach((w,wi)=>{
    const team=w.team||(active==='All IAD'?null:active);
    const c=col(team);
    rows+=`<tr class="${wi>0?'rdiv':''}">
      <td class="wscell"><span class="wslabel">${w.ws}</span></td>
      <td colspan="4" style="padding:6px 0 2px"></td></tr>`;
    w.items.forEach(item=>{
      rows+=`<tr><td></td>
        <td colspan="4" style="position:relative;height:26px;padding:2px 0">
          <span class="sbar" data-s="${item.s}" data-e="${item.e}"
            style="background:${c.bg};color:${c.tx}">${item.n}</span>
        </td></tr>`;
    });
    rows+=`<tr><td colspan="5" style="height:4px"></td></tr>`;
  });
  document.getElementById('gc').innerHTML=`<table id="gtbl">
    <thead><tr>
      <th class="cws"></th>
      <th class="cq qcur"><span class="cdot"></span>FY27 Q1</th>
      <th class="cq">FY27 Q2</th>
      <th class="cq">FY27 Q3</th>
      <th class="cq">FY27 Q4</th>
    </tr></thead><tbody>${rows}</tbody></table>`;
  positionBars();
  positionTodayMarker();
}

function positionBars(){
  const tbl=document.getElementById('gtbl');
  if(!tbl)return;
  const ths=tbl.querySelectorAll('th');
  if(ths.length<5)return;
  const qW=ths[1].offsetWidth;
  if(!qW)return;
  document.querySelectorAll('#gc .sbar[data-s]').forEach(bar=>{
    const s=parseInt(bar.dataset.s),e=parseInt(bar.dataset.e);
    bar.style.left=((s-1)*qW)+'px';
    bar.style.width=((e-s+1)*qW-4)+'px';
  });
}

function positionTodayMarker(){
  const tbl=document.getElementById('gtbl');
  const marker=document.getElementById('today-marker');
  if(!tbl||!marker)return;
  const ths=tbl.querySelectorAll('th');
  if(ths.length<5)return;
  const wsW=ths[0].offsetWidth;
  const qW=ths[1].offsetWidth;
  if(!qW)return;
  // left edge of the gantt area + offset into the target quarter
  const left=wsW + (markerQuarter-1)*qW + markerPos*qW;
  marker.style.left=left+'px';
  // top: start just below the th row
  const theadH=tbl.querySelector('thead').offsetHeight;
  marker.style.top=theadH+'px';
}

function sw(t){active=t;renderTabs();render();}
window.addEventListener('resize',()=>{positionBars();positionTodayMarker();});
renderTabs();render();
